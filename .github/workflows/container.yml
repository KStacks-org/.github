name: Build and publish image

on:
  workflow_call:
    inputs:
      frontend:
        description: Build dev and prod variants with Vite modes.
        type: boolean
        default: false
      dockerfile:
        type: string
        default: Dockerfile
      maven-package:
        description: Build the JAR before using Dockerfile.ci.
        type: boolean
        default: false
      github-packages:
        description: Pass GitHub credentials to the Docker build for Maven dependencies.
        type: boolean
        default: false
      platforms:
        type: string
        default: linux/amd64
      build-args:
        type: string
        default: ''
      infra-app:
        description: Helm app to update on dev/prod pushes; empty only publishes images.
        type: string
        default: ''
    secrets:
      INFRA_PAT:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  container:
    name: Build ${{ matrix.variant }} image
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.frontend && '["dev","prod"]' || '["shared"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: inputs.maven-package
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build JAR
        if: inputs.maven-package
        run: sh ./mvnw --batch-mode clean package -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=${{ matrix.variant != 'shared' && format('{0}-', matrix.variant) || 'sha-' }},format=short
            type=semver,pattern={{version}},prefix=${{ matrix.variant != 'shared' && format('{0}-', matrix.variant) || '' }}

      - name: Build and publish
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ inputs.frontend && format('BUILD_MODE={0}', matrix.variant) || '' }}
            ${{ inputs.github-packages && format('GITHUB_USERNAME={0}', github.actor) || '' }}
            ${{ inputs.github-packages && format('GITHUB_TOKEN={0}', secrets.GITHUB_TOKEN) || '' }}
            ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: Checkout infra
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod') && inputs.infra-app != '' && (matrix.variant == 'shared' || matrix.variant == github.ref_name)
        uses: actions/checkout@v4
        with:
          repository: KStacks-org/infra
          ref: prod
          token: ${{ secrets.INFRA_PAT }}
          path: infra

      - name: Update environment image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod') && inputs.infra-app != '' && (matrix.variant == 'shared' || matrix.variant == github.ref_name)
        working-directory: infra
        env:
          APP: ${{ inputs.infra-app }}
          DEPLOY_ENV: ${{ github.ref_name }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          file="apps/$APP/values-$DEPLOY_ENV.yaml"
          test -f "$file" || { echo "Merge the infra Helm migration first." >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          yq -i '.image.tag = strenv(IMAGE_TAG) | .image.digest = strenv(IMAGE_DIGEST)' "$file"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git diff --cached --quiet && exit 0
          git commit -m "chore($APP): deploy $IMAGE_TAG to $DEPLOY_ENV"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin prod
            if git push origin HEAD:prod; then
              exit 0
            fi
            sleep 2
          done
          echo "Failed to update infra after five attempts." >&2
          exit 1
